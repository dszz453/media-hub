<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MediaHub · 跨平台音频播放器</title>
<link rel="stylesheet" href="/static/style.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎧</text></svg>" />
</head>
<body>

<div class="app">

  <!-- ================= 左侧导航 ================= -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">♪</div>
      <div class="brand-text">
        <strong>MediaHub</strong>
        <span>小红书 · 抖音 · YouTube</span>
      </div>
    </div>

    <nav class="nav" id="nav">
      <a class="nav-item active" data-view="search"><i>🔍</i><span>搜索</span></a>
      <a class="nav-item" data-view="favorites"><i>❤️</i><span>我的收藏</span></a>
      <a class="nav-item" data-view="history"><i>🕘</i><span>最近播放</span></a>
      <a class="nav-item" data-view="playlists"><i>📁</i><span>我的歌单</span></a>
      <a class="nav-item" data-view="tasks"><i>⬇️</i><span>任务队列</span><em id="taskBadge" class="badge hidden">0</em></a>
      <a class="nav-item" data-view="account"><i>👤</i><span>账号登录</span><em id="loginBadge" class="badge badge-warn hidden">!</em></a>
      <a class="nav-item" data-view="settings"><i>⚙️</i><span>设置</span></a>
    </nav>

    <div class="sidebar-foot">
      <div class="storage" id="storageInfo">加载中…</div>
    </div>
  </aside>

  <!-- ================= 主区域 ================= -->
  <main class="main">

    <header class="topbar">
      <div class="searchbox">
        <span class="search-ico">🔍</span>
        <input id="kw" type="text" placeholder="搜索视频，回车即搜（支持小红书 / 抖音 / YouTube）" autocomplete="off" />
        <button id="btnSearch" class="btn-primary">搜索</button>
      </div>
      <div class="platform-tabs" id="platformTabs">
        <button class="ptab active" data-platform="all">全部</button>
        <button class="ptab" data-platform="xhs">小红书</button>
        <button class="ptab" data-platform="douyin">抖音</button>
        <button class="ptab" data-platform="youtube">YouTube</button>
      </div>
    </header>

    <section class="content" id="content">
      <!-- 视图内容由 JS 渲染 -->
    </section>

  </main>

  <!-- ================= 播放队列抽屉 ================= -->
  <aside class="queue-panel" id="queuePanel">
    <div class="queue-head">
      <span>播放队列</span>
      <button class="icon-btn" id="btnClearQueue" title="清空">🗑</button>
    </div>
    <div class="queue-list" id="queueList"></div>
  </aside>

</div>

<!-- ================= 底部播放条 ================= -->
<footer class="playerbar" id="playerbar">
  <div class="pb-left">
    <div class="pb-cover">
      <img id="pbCover" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" alt="" />
      <div class="pb-cover-mask"></div>
    </div>
    <div class="pb-info">
      <div class="pb-title" id="pbTitle">未在播放</div>
      <div class="pb-author" id="pbAuthor">搜索并点击「转音频」开始</div>
    </div>
  </div>

  <div class="pb-controls">
    <div class="pb-buttons">
      <button class="icon-btn" id="btnMode" title="播放模式">🔁</button>
      <button class="icon-btn" id="btnPrev" title="上一首">⏮</button>
      <button class="play-btn" id="btnPlay" title="播放/暂停">▶</button>
      <button class="icon-btn" id="btnNext" title="下一首">⏭</button>
      <button class="icon-btn" id="btnFav" title="收藏">♡</button>
    </div>
    <div class="pb-progress">
      <span id="curTime">00:00</span>
      <div class="bar" id="barProgress"><div class="bar-fill" id="fillProgress"></div><div class="bar-knob" id="knobProgress"></div></div>
      <span id="totTime">00:00</span>
    </div>
  </div>

  <div class="pb-right">
    <span class="vol-ico" id="volIco">🔊</span>
    <div class="bar bar-vol" id="barVolume"><div class="bar-fill" id="fillVolume"></div><div class="bar-knob" id="knobVolume"></div></div>
    <button class="icon-btn" id="btnQueue" title="播放队列">☰</button>
  </div>
</footer>

<audio id="audio" preload="metadata"></audio>
<div class="toast-wrap" id="toastWrap"></div>

<!-- ================= 扫码登录弹窗 ================= -->
<div class="modal hidden" id="loginModal">
  <div class="modal-mask" data-login-close="1"></div>
  <div class="modal-panel login-panel">
    <div class="modal-head">
      <strong id="loginTitle">扫码登录</strong>
      <button class="icon-btn" id="btnLoginClose" title="关闭">✕</button>
    </div>
    <div class="login-stage">
      <div class="qr-box">
        <img id="loginQr" alt="登录二维码" />
        <div class="qr-loading" id="qrLoading"><div class="spinner"></div><span>正在打开登录页…</span></div>
      </div>
      <div class="login-status" id="loginStatus">正在获取二维码…</div>
      <div class="login-hint" id="loginHint"></div>
      <div class="login-actions">
        <button class="btn-ghost" id="btnLoginRefresh">刷新二维码</button>
      </div>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
