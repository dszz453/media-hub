services:
  # ---------------------------------------------------------------------------
  # 主服务：搜索 / 收藏 / 歌单 / 音频转码 / 在线播放
  # ---------------------------------------------------------------------------
  media-hub:
    build:
      context: .
      dockerfile: Dockerfile
    image: media-hub:latest
    container_name: media-hub
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      # ---------- 平台凭据 ----------
      # 扫码登录成功后，运行时的 data/cookies.json 会覆盖这里；
      # 这两项留空也能用，只是扫码前该平台不可用。
      XHS_COOKIE: "${XHS_COOKIE:-}"
      DOUYIN_COOKIE: "${DOUYIN_COOKIE:-}"
      # 可选：浏览器级 x-s 签名服务（纯 Python 签名失效时才有意义）
      XHS_SIGN_SERVER: "${XHS_SIGN_SERVER:-}"
      YTDLP_COOKIES_FILE: "${YTDLP_COOKIES_FILE:-}"

      # ---------- 扫码登录代理 ----------
      LOGIN_AGENT_URL: "${LOGIN_AGENT_URL:-http://login-agent:8100}"
      LOGIN_ENABLED: "${LOGIN_ENABLED:-true}"
      LOGIN_TIMEOUT: "${LOGIN_TIMEOUT:-180}"

      # ---------- 网络 ----------
      # YouTube 在部分网络环境下需要代理
      PROXY: "${PROXY:-}"
      YOUTUBE_REGION: "${YOUTUBE_REGION:-HK}"

      # ---------- 音频 ----------
      AUDIO_FORMAT: "${AUDIO_FORMAT:-mp3}"
      AUDIO_BITRATE: "${AUDIO_BITRATE:-192k}"
      EMBED_COVER: "${EMBED_COVER:-true}"
      EMBED_METADATA: "${EMBED_METADATA:-true}"
      KEEP_VIDEO: "${KEEP_VIDEO:-false}"

      # ---------- 并发 ----------
      MAX_CONCURRENT_JOBS: "${MAX_CONCURRENT_JOBS:-2}"
      SEARCH_CACHE_TTL: "${SEARCH_CACHE_TTL:-600}"
    volumes:
      - ./data:/data
    restart: unless-stopped
    depends_on:
      - login-agent
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # 扫码登录代理：用真实 Chromium 完成小红书 / 抖音扫码
  #
  #   为什么必须单独一个容器跑浏览器：
  #     * 小红书 web 接口的 x-s 签名算法持续升级，纯 Python 实现（xhs==0.2.13）
  #       实测在登录类接口上稳定 406；逆向跟进成本高且随时失效。
  #     * 抖音 passport 接口有 JSVM(argus) 风控，直接返回 JS 验证页而非 JSON。
  #   两者都只认真实浏览器，所以把 Chromium 隔离在这里，主服务保持轻量。
  #
  #   资源占用：镜像约 1GB；运行时常驻内存约 200~350MB（Chromium 空闲态）。
  #   不需要扫码时可以停掉它：docker compose stop login-agent
  # ---------------------------------------------------------------------------
  login-agent:
    build:
      context: ./login-agent
      dockerfile: Dockerfile
    image: media-hub-login-agent:latest
    container_name: media-hub-login
    # Chromium 对 /dev/shm 有要求，Docker 默认只有 64MB，必须放大
    shm_size: "512m"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8100/health',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 90s
