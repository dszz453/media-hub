services:
  media-hub:
    build:
      context: .
      dockerfile: Dockerfile
    image: media-hub:latest
    container_name: media-hub
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      # ---------- 平台凭据（留空则该平台降级/禁用）----------
      XHS_COOKIE: "${XHS_COOKIE:-}"
      XHS_SIGN_SERVER: "${XHS_SIGN_SERVER:-}"
      DOUYIN_COOKIE: "${DOUYIN_COOKIE:-}"
      YTDLP_COOKIES_FILE: "${YTDLP_COOKIES_FILE:-}"

      # ---------- 网络 ----------
      # YouTube 在部分网络环境下需要代理
      PROXY: "${PROXY:-}"
      YOUTUBE_REGION: "${YOUTUBE_REGION:-HK}"

      # ---------- 音频 ----------
      AUDIO_FORMAT: "${AUDIO_FORMAT:-mp3}"
      AUDIO_BITRATE: "${AUDIO_BITRATE:-192k}"
      EMBED_COVER: "${EMBED_COVER:-true}"
      EMBED_METADATA: "${EMBED_METADATA:-true}"
      KEEP_VIDEO: "${KEEP_VIDEO:-false}"

      # ---------- 并发 ----------
      MAX_CONCURRENT_JOBS: "${MAX_CONCURRENT_JOBS:-2}"
      SEARCH_CACHE_TTL: "${SEARCH_CACHE_TTL:-600}"
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # 可选：小红书 x-s 签名 sidecar
  #   小红书 Web 接口需要 x-s 签名，官方实现依赖 playwright + Chromium（约 400MB）。
  #   把签名拆到独立容器，主镜像就能保持轻量。
  #
  #   启用方式：
  #     docker compose --profile sign up -d
  #   并在 .env 里设置：
  #     XHS_SIGN_SERVER=http://xhs-sign:5005
  #
  #   注意：sign 服务启动日志里会打印一个 a1，建议让它与 XHS_COOKIE 中的 a1 保持一致，
  #   否则签名校验会间歇性失败。
  # ---------------------------------------------------------------------------
  xhs-sign:
    image: reajason/xhs-api:latest
    container_name: xhs-sign
    profiles: ["sign"]
    restart: unless-stopped
